[project]
name = "nrm-newton"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0",
    "warp-lang>=1.13.0",
    "newton>=1.1.0",
    "scipy>=1.17.1",
    "jaxtyping>=0.3.9",
    "viser>=1.0.27",
    "tqdm>=4.67.3",
    "matplotlib>=3.9.0",
    "nvidia-curobo[cu13]",
    "pyglet>=2.1.14",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["interface", "validation", "optim", "task", "util"]

[tool.uv.sources]
nvidia-curobo = { git = "https://github.com/NVlabs/curobo" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.14",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Suppress false positives from jaxtyping
[tool.ruff.lint]
ignore = ["F722", "F821", "E402"]