[project]
name = "nrm-newton"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0",
    "warp-lang>=1.13.0",
    "newton>=1.1.0",
    "scipy>=1.17.1",
    "jaxtyping>=0.3.9",
    "viser>=1.0.27",
    "tqdm>=4.67.3",
    "eaik>=1.2.1",
    "beartype>=0.22.3",
]

# cuRobo is not on PyPI — install from source into this project's venv:
#   git clone https://github.com/NVlabs/curobo && cd curobo
#   nvidia-smi | grep CUDA   # check your CUDA version
#   uv pip install --python /u/halle/arke/home_at/Documents/nrm-newton/.venv/bin/python .[cu12]        # CUDA 12.x
#   uv pip install --python /u/halle/arke/home_at/Documents/nrm-newton/.venv/bin/python .[cu12-torch]  # CUDA 12.x + torch
#   uv pip install --python /u/halle/arke/home_at/Documents/nrm-newton/.venv/bin/python .[cu13]        # CUDA 13.x
# See https://nvlabs.github.io/curobo/latest/getting-started/installation.html

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["interface", "validation", "optim", "task", "util"]
