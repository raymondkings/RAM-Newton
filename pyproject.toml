[project]
name = "nrm-newton"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "warp>=0.3",
    "newton>=0.1",
    "scipy>=1.10",
    "jaxtyping",
    "viser>=1.0.26",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["interface", "validation_module"]